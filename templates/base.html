<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Monitor de energía{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --fondo: #0f1420;
      --panel: #182032;
      --borde: #263149;
      --tenue: #8a97b1;
    }
    body { background: var(--fondo); }
    .card {
      background: var(--panel);
      border: 1px solid var(--borde);
      border-radius: 14px;
    }
    .etiqueta {
      font-size: .75rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--tenue);
    }
    .valor {
      font-size: 2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .valor small { font-size: 1rem; font-weight: 400; color: var(--tenue); }
    .grafica-caja { height: 300px; }
    .table { --bs-table-bg: transparent; font-variant-numeric: tabular-nums; }
    .aviso-corte {
      background: rgba(255, 93, 108, .12);
      border: 1px solid #ff5d6c;
      border-radius: 14px;
    }
    .menu-lateral { background: var(--panel); width: 260px; }
    .menu-lateral .list-group-item {
      background: transparent;
      border: 0;
      border-radius: 10px;
      margin-bottom: 4px;
    }
    .menu-lateral .list-group-item.active { background: #2b6fd6; }
  </style>
</head>
<body>

  <nav class="navbar border-bottom mb-4" style="border-color: var(--borde) !important;">
    <div class="container">
      <div class="d-flex align-items-center gap-2">
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#menu" aria-controls="menu" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <span class="navbar-brand fw-bold mb-0">⚡ Monitor de energía</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        {% block navbar_extra %}{% endblock %}
        <span class="small d-none d-sm-inline" style="color: var(--tenue);">{{ usuario }}</span>
        <form method="post" action="/logout" class="m-0">
          <button class="btn btn-sm btn-outline-secondary" type="submit">Salir</button>
        </form>
      </div>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start menu-lateral" tabindex="-1" id="menu" aria-labelledby="menu-titulo">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="menu-titulo">Menú</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body">
      <div class="list-group">
        <a href="/" class="list-group-item list-group-item-action {% if pagina == 'dashboard' %}active{% endif %}">
          Dashboard
        </a>
        <a href="/reportes" class="list-group-item list-group-item-action {% if pagina == 'reportes' %}active{% endif %}">
          Reportes
        </a>
      </div>
    </div>
  </div>

  <main class="container pb-5">
    {% block contenido %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Utilidades compartidas por todas las páginas
    const $ = (id) => document.getElementById(id);
    const num = (v) => (v === null || v === undefined) ? "--" : Number(v).toFixed(2);

    // Pide datos a la API; si la sesión venció, manda al login
    async function pedir(url, opciones) {
      const respuesta = await fetch(url, opciones);
      if (respuesta.status === 401) {
        window.location.href = "/login";
        throw new Error("Sesión vencida");
      }
      return respuesta.json();
    }

    Chart.defaults.color = "#8a97b1";
    Chart.defaults.borderColor = "#263149";
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
