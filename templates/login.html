<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Monitor de energía</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      /* Fondo oscuro con un resplandor azul muy suave detrás de la tarjeta */
      background:
        radial-gradient(circle at 50% 30%, rgba(77, 163, 255, .10), transparent 55%),
        #0f1420;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      background: #182032;
      border: 1px solid #263149;
      border-radius: 18px;
      width: min(92vw, 380px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .35);
    }
    /* Círculo que enmarca el logo */
    .logo-marco {
      width: 112px;
      height: 112px;
      margin: 0 auto 1.25rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(77, 163, 255, .20), rgba(77, 163, 255, .04) 70%);
      border: 1px solid rgba(77, 163, 255, .30);
      box-shadow: 0 0 36px rgba(77, 163, 255, .22);
    }
    .logo {
      width: 76px;
      height: 76px;
      /* Brillo que sigue la forma del rayo, no la del cuadro de la imagen */
      filter: drop-shadow(0 0 8px rgba(77, 163, 255, .55));
    }
    .subtitulo { color: #8a97b1; }
  </style>
</head>
<body>
  <form class="card p-4" method="post" action="/login">
    <div class="logo-marco">
      <img class="logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo del proyecto">
    </div>

    <h1 class="h4 fw-bold mb-1 text-center">Monitor de energía</h1>
    <p class="subtitulo mb-4 text-center">Ingresá para ver el panel.</p>

    {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <label class="form-label" for="usuario">Usuario</label>
    <input class="form-control mb-3" id="usuario" name="usuario" autocomplete="username" required autofocus>

    <label class="form-label" for="clave">Contraseña</label>
    <input class="form-control mb-4" id="clave" name="clave" type="password" autocomplete="current-password" required>

    <button class="btn btn-primary w-100" type="submit">Ingresar</button>
  </form>
</body>
</html>
