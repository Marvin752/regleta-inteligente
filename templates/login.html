<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Monitor de energía</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #0f1420;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      background: #182032;
      border: 1px solid #263149;
      border-radius: 14px;
      width: min(92vw, 380px);
    }
  </style>
</head>
<body>
  <form class="card p-4" method="post" action="/login">
    <h1 class="h4 fw-bold mb-1">⚡ Monitor de energía</h1>
    <p class="text-secondary mb-4">Ingresá para ver el panel.</p>

    {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <label class="form-label" for="usuario">Usuario</label>
    <input class="form-control mb-3" id="usuario" name="usuario" autocomplete="username" required autofocus>

    <label class="form-label" for="clave">Contraseña</label>
    <input class="form-control mb-4" id="clave" name="clave" type="password" autocomplete="current-password" required>

    <button class="btn btn-primary w-100" type="submit">Ingresar</button>
  </form>
</body>
</html>
